{% extends "base.html" %}

{% block title %}Playing — Family Feud AI{% endblock %}

{% block content %}
<div id="game-container">

    <!-- Loading Screen (shown while fetching first round) -->
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p>Loading your board...</p>
    </div>

    <!-- Game Area (hidden until round loads) -->
    <div id="game-area" class="game-area hidden">
        
        <!-- Prompt Display -->
        <div id="prompt-area" class="prompt-area">
            <div class="prompt-badges">
                <span id="source-badge" class="badge badge-real">REAL</span>
                <span id="category-badge" class="badge badge-category">General</span>
            </div>
            <h2 id="prompt-text" class="prompt-text">Loading question...</h2>
        </div>

        <!-- Answer Board -->
        <div id="answer-board" class="answer-board">
            <!-- Slots generated by JS -->
        </div>

        <!-- Stats Bar -->
        <div id="stats-bar" class="stats-bar">
            <div class="stat-group">
                <span class="stat-label">Score</span>
                <span id="score-display" class="stat-value score-value">0</span>
            </div>
            <div class="stat-group">
                <span class="stat-label">Strikes</span>
                <div id="strikes-display" class="strikes-display">
                    <span class="strike-x" data-index="0">✕</span>
                    <span class="strike-x" data-index="1">✕</span>
                    <span class="strike-x" data-index="2">✕</span>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div id="input-area" class="input-area">
            <form id="guess-form" class="guess-form" autocomplete="off">
                <input 
                    type="text" 
                    id="guess-input" 
                    class="guess-input" 
                    placeholder="Type your guess..."
                    maxlength="100"
                    autofocus
                >
                <button type="submit" id="submit-btn" class="btn btn-primary">
                    Guess
                </button>
            </form>
        </div>

        <!-- Guess History -->
        <div id="guess-history" class="guess-history">
            <h4>Your Guesses</h4>
            <ul id="guess-list" class="guess-list">
                <!-- Filled by JS -->
            </ul>
        </div>
    </div>

    <!-- Round Over Overlay -->
    <div id="round-over-overlay" class="overlay hidden">
        <div class="overlay-card">
            <h2 class="overlay-title" id="overlay-title">Round Over!</h2>
            <div id="final-board" class="final-board">
                <!-- Filled by JS -->
            </div>
            <div class="overlay-stats">
                <div class="overlay-stat">
                    <span class="stat-label">Final Score</span>
                    <span id="final-score" class="stat-value score-value">0</span>
                </div>
                <div class="overlay-stat">
                    <span class="stat-label">Strikes</span>
                    <span id="final-strikes" class="stat-value">0</span>
                </div>
            </div>
            <p id="commentary" class="commentary hidden"></p>
            <div class="overlay-actions">
                <button id="play-again-btn" class="btn btn-primary btn-large">Play Again</button>
                <a href="/" class="btn btn-secondary">Back to Home</a>
            </div>
        </div>
    </div>

</div>

<!-- Pass initial category from server -->
<script>
    window.__INITIAL_CATEGORY__ = {{ (category | tojson) if category else 'null' }};
</script>
{% endblock %}

{% block scripts %}
<script src="/static/js/game.js"></script>
{% endblock %}
