<!--
  game.html — Game Page (SPA Shell)

  Responsibilities:
  - Survey prompt display area
  - Answer board with slots (hidden → revealed animation)
  - Guess input field + submit button
  - Strikes display (X X X)
  - Score display
  - Guess history sidebar/area
  - Source type badge (REAL / AI / HYBRID)
  - Round-over overlay with full board reveal
  - "New Round" / "Play Again" button
  - Loading states for API calls

  All gameplay logic is in game.js — this is just the HTML structure.
  game.js drives everything via fetch() calls to /api/* endpoints.

  Design goals:
  - One-screen gameplay (no scrolling needed)
  - Answer board is the visual centerpiece
  - Satisfying reveal animations when answers are uncovered
  - Clear visual feedback for correct guess vs strike
  - Mobile-responsive layout
-->
