{% extends "base.html" %}

{% block title %}Playing -- AI Feud{% endblock %}

{% block content %}
<div id="game-container">

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="spinner"></div>
        <p>Loading your board...</p>
    </div>

    <!-- Game Area -->
    <div id="game-area" class="game-area hidden">
        
        <!-- Score Display (top center) -->
        <div id="score-bar" class="score-bar">
            <span id="score-display" class="score-number">0</span>
        </div>

        <!-- Timer Bar -->
        <div id="timer-container" class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div id="timer-text" class="timer-text">60s</div>

        <!-- Prompt Display -->
        <div id="prompt-area" class="prompt-area">
            <h2 id="prompt-text" class="prompt-text">Loading question...</h2>
        </div>

        <!-- Answer Board (2-column grid) -->
        <div id="answer-board" class="answer-board">
            <!-- Slots generated by JS -->
        </div>

        <!-- Strikes Display -->
        <div id="strikes-area" class="strikes-area">
            <span class="strike-x" data-index="0">X</span>
            <span class="strike-x" data-index="1">X</span>
            <span class="strike-x" data-index="2">X</span>
        </div>

        <!-- Input Area -->
        <div id="input-area" class="input-area">
            <form id="guess-form" class="guess-form" autocomplete="off">
                <input 
                    type="text" 
                    id="guess-input" 
                    class="guess-input" 
                    placeholder="Type your answer..."
                    maxlength="100"
                    autofocus
                >
                <button type="submit" id="submit-btn" class="btn btn-submit">
                    SUBMIT
                </button>
            </form>
        </div>

        <!-- Guess History -->
        <div id="guess-history" class="guess-history">
            <ul id="guess-list" class="guess-list">
            </ul>
        </div>
    </div>

    <!-- Round Over Overlay -->
    <div id="round-over-overlay" class="overlay hidden">
        <div class="overlay-card">
            <h2 class="overlay-title" id="overlay-title">Round Over</h2>
            <div id="final-board" class="final-board">
            </div>
            <div class="overlay-stats">
                <div class="overlay-stat">
                    <span class="stat-label">FINAL SCORE</span>
                    <span id="final-score" class="stat-value score-number">0</span>
                </div>
                <div class="overlay-stat">
                    <span class="stat-label">STRIKES</span>
                    <span id="final-strikes" class="stat-value">0</span>
                </div>
            </div>
            <p id="commentary" class="commentary hidden"></p>
            <div class="overlay-actions">
                <button id="play-again-btn" class="btn btn-play">PLAY AGAIN</button>
                <a href="/" class="btn btn-secondary">HOME</a>
            </div>
        </div>
    </div>

</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/game.js?v=3"></script>
{% endblock %}
